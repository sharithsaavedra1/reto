global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: "training-environment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080", "training-environment-service:8080"]
        labels:
          environment: "local-dev"
          service: "training-environment-service"
