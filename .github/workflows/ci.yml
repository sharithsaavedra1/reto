name: CI - Build and Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, qa, staging, main]

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: design_software_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify code formatting and vet
        run: |
          go vet ./...

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/design_software_test?sslmode=disable
          REQUIRE_POSTGRES_INTEGRATION: "1"
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Application Binary
        run: |
          go build -v -o bin/training-environment-api ./cmd/training-environment-api
