name: CI - Build and Test

on:
  push:
    branches: [develop, main, hu-15-dev]
  pull_request:
    branches: [develop, qa, staging, main, hu-15-dev]

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: design_software_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d design_software_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Checkout DB Schema Repository
        uses: actions/checkout@v4
        with:
          repository: code-sena/design-software-training-environment-db
          ref: ${{ github.base_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: db-schema

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Liquibase CLI
        run: |
          wget -q https://github.com/liquibase/liquibase/releases/download/v4.29.2/liquibase-4.29.2.tar.gz
          sudo mkdir -p /opt/liquibase
          sudo tar -xzf liquibase-4.29.2.tar.gz -C /opt/liquibase
          sudo ln -s /opt/liquibase/liquibase /usr/local/bin/liquibase
          liquibase --version

      - name: Run Liquibase Migrations (Full changelog-master.yaml)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/design_software_test" \
            --username=postgres \
            --password=postgrespassword \
            --changelog-file=db-schema/changelog/changelog-master.yaml \
            update

      - name: Install dependencies
        run: go mod download

      - name: Verify code formatting and vet
        run: |
          go vet ./...

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/design_software_test?sslmode=disable
          REQUIRE_POSTGRES_INTEGRATION: "1"
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Application Binary
        run: |
          go build -v -o bin/training-environment-api ./cmd/training-environment-api
